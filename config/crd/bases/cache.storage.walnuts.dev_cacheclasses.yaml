apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cacheclasses.cache.storage.walnuts.dev
spec:
  group: cache.storage.walnuts.dev
  scope: Cluster
  names:
    plural: cacheclasses
    singular: cacheclass
    kind: CacheClass
    shortNames:
      - cc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Backend
          type: string
          jsonPath: .spec.backend
        - name: MaxBytes
          type: string
          jsonPath: .spec.maxBytes
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: CacheClass defines a node-local cache policy used by CSI inline ephemeral volumes.
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "!has(self.quota) || !has(self.quota.enabled) || !self.quota.enabled || (has(self.backend) && self.backend == 'xfs-project')"
                  message: quota requires the xfs-project backend
                - rule: "!has(self.backend) || self.backend != 'xfs-project' || (has(self.quota) && has(self.quota.enabled) && self.quota.enabled)"
                  message: xfs-project backend requires quota to be enabled
                - rule: "!has(self.maxBytes) || quantity(string(self.maxBytes)).sign() >= 0"
                  message: maxBytes must not be negative
                - rule: "!has(self.quota) || !has(self.quota.defaultMaxBytes) || quantity(string(self.quota.defaultMaxBytes)).sign() >= 0"
                  message: quota.defaultMaxBytes must not be negative
                - rule: "!has(self.maxBytes) || quantity(string(self.maxBytes)).sign() <= 0 || (has(self.quota) && has(self.quota.enabled) && self.quota.enabled && has(self.backend) && self.backend == 'xfs-project')"
                  message: maxBytes requires quota to be enabled with the xfs-project backend
                - rule: "!has(self.quota) || !has(self.quota.defaultMaxBytes) || quantity(string(self.quota.defaultMaxBytes)).sign() <= 0 || (has(self.quota.enabled) && self.quota.enabled && has(self.backend) && self.backend == 'xfs-project')"
                  message: quota.defaultMaxBytes requires quota to be enabled with the xfs-project backend
                - rule: "!has(self.quota) || !has(self.quota.enabled) || !self.quota.enabled || ((has(self.maxBytes) && quantity(string(self.maxBytes)).sign() > 0) || (has(self.quota.defaultMaxBytes) && quantity(string(self.quota.defaultMaxBytes)).sign() > 0))"
                  message: quota requires maxBytes or quota.defaultMaxBytes
                - rule: "!has(self.maxBytes) || quantity(string(self.maxBytes)).sign() <= 0 || !has(self.quota) || !has(self.quota.defaultMaxBytes) || !quantity(string(self.quota.defaultMaxBytes)).isGreaterThan(quantity(string(self.maxBytes)))"
                  message: quota.defaultMaxBytes must not exceed maxBytes
              properties:
                backend:
                  type: string
                  enum:
                    - directory
                    - xfs-project
                  description: Storage backend used for cache generations.
                maxBytes:
                  x-kubernetes-int-or-string: true
                  anyOf:
                    - type: integer
                    - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([eEinumkKMGTP]+)|(([KMGTPE]i)))?$
                  description: Maximum per-cache quota ceiling for volume-level maxBytes requests in this class. Requires quota.enabled and the xfs-project backend; requests above this limit are rejected.
                retention:
                  type: string
                  description: Maximum age of an unused cache before it becomes eligible for garbage collection.
                schemaVersion:
                  type: string
                  description: Application cache format version included in cache identity.
                crashRecovery:
                  type: string
                  enum:
                    - discard
                    - reuse
                  description: Policy for generations left active after an unclean node shutdown.
                evictRunning:
                  type: boolean
                  description: Allows best-effort pressure handling to request graceful eviction of Pods using active cache generations. Eviction requests respect PodDisruptionBudgets and do not guarantee cache reclamation.
                noExec:
                  type: boolean
                  description: Mounts cache generations with execution disabled.
                quota:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Enables XFS project quota enforcement for each cache identity. Requires the xfs-project backend and a per-cache limit in maxBytes or defaultMaxBytes.
                    defaultMaxBytes:
                      x-kubernetes-int-or-string: true
                      anyOf:
                        - type: integer
                        - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([eEinumkKMGTP]+)|(([KMGTPE]i)))?$
                      description: Per-cache hard limit used when the CSI volume context omits maxBytes. If maxBytes is set, this default must not exceed the class ceiling.
