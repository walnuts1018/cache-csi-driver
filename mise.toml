[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
helm = "4.3.0"
kind = "0.33.0"
kubectl = "1.37.1"
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "v0.22.0"
"go:github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity" = "v5.6.0"

[tasks.build]
description = "Build the CSI node plugin"
run = """
set -euo pipefail
mkdir -p dist
go build -trimpath -o dist/cache-csi-node ./cmd/cache-csi-node
"""

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks."test:race"]
description = "Run Go tests with the race detector"
run = "go test -race ./..."

[tasks."test:csi-sanity"]
description = "Node-only CSI capability checks with csi-sanity"
run = """
set -euo pipefail
tmp_dir="$(mktemp -d)"
container_name="cache-csi-sanity-$$"
cleanup() {
  if docker container inspect "$container_name" >/dev/null 2>&1; then
    docker rm -f "$container_name" >/dev/null 2>&1 || true
  fi
  rm -rf "$tmp_dir"
}
trap cleanup EXIT

go_arch="$(go env GOARCH)"
host_os="$(uname -s)"
GOOS=linux GOARCH="$go_arch" CGO_ENABLED=0 go build -trimpath -o "$tmp_dir/cache-csi-node" ./cmd/cache-csi-node
if ! csi_sanity_bin="$(command -v csi-sanity)"; then
  echo "csi-sanity is not available on PATH; run this task through mise" >&2
  exit 1
fi
if [ "$host_os" = Darwin ]; then
  # Docker DesktopではhostとLinux VM間のUnix socket接続を利用できないため、DarwinではLinux向けsanity binaryを生成する。
  go_mod_cache="$(go env GOMODCACHE)"
  unset GOBIN
  GOOS=linux GOARCH="$go_arch" CGO_ENABLED=0 GOPATH="$tmp_dir" GOMODCACHE="$go_mod_cache" go install -trimpath github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity@v5.6.0
  csi_sanity_bin="$tmp_dir/bin/linux_$go_arch/csi-sanity"
fi
cp "$csi_sanity_bin" "$tmp_dir/csi-sanity"
chmod 0755 "$tmp_dir/csi-sanity"

docker run --detach --privileged --platform "linux/$go_arch" --name "$container_name" \
  -v "$tmp_dir:/tmp/csi-sanity" \
  --entrypoint /bin/bash \
  ubuntu:26.04 \
  -lc 'set -euo pipefail
    /tmp/csi-sanity/cache-csi-node \
      -endpoint unix:///tmp/csi-sanity/csi.sock \
      -cache-root /tmp/csi-sanity/cache \
      -kubelet-root /tmp/csi-sanity/kubelet \
      -node-id csi-sanity-test &
    driver_pid=$!
    trap "kill $driver_pid 2>/dev/null || true; wait $driver_pid 2>/dev/null || true" EXIT
    wait "$driver_pid"'

for _ in $(seq 1 100); do
  if [ -S "$tmp_dir/csi.sock" ]; then
    break
  fi
  if ! docker container inspect "$container_name" 2>/dev/null | grep -q '"Running": true'; then
    docker logs "$container_name" >&2 || true
    echo "CSI node plugin stopped before creating its socket" >&2
    exit 1
  fi
  sleep 0.1
done
if [ ! -S "$tmp_dir/csi.sock" ]; then
  docker logs "$container_name" >&2 || true
  echo "CSI node plugin did not create its socket" >&2
  exit 1
fi

docker exec "$container_name" /tmp/csi-sanity/csi-sanity \
  --csi.endpoint=unix:///tmp/csi-sanity/csi.sock \
  --csi.mountdir=/tmp/csi-sanity/mount \
  --csi.stagingdir=/tmp/csi-sanity/staging \
  --ginkgo.focus="NodeGetCapabilities|NodeGetInfo|GetPluginCapabilities|GetPluginInfo" \
  --ginkgo.v
"""

[tasks."test:mount-api"]
description = "Linux mount API integration coverage in a privileged container"
run = """
set -euo pipefail
tmp_dir="$(mktemp -d)"
trap 'rm -rf "$tmp_dir"' EXIT

go_arch="$(go env GOARCH)"
GOOS=linux GOARCH="$go_arch" CGO_ENABLED=0 go test -c -o "$tmp_dir/mount-api.test" ./internal/driver
docker run --rm --privileged --platform "linux/$go_arch" \
  --env CACHE_CSI_REQUIRE_MOUNT_API=1 \
  -v "$tmp_dir:/tmp/cache-csi-mount-api:ro" \
  --entrypoint /tmp/cache-csi-mount-api/mount-api.test \
  ubuntu:26.04 \
  -test.v -test.count=1 -test.run '^Test(MountUsesOpenTreeMountSetattrMoveMount|RecoverPreparingLeaseAfterDriverRestartWithAttachedMount)$'
"""

[tasks."test:xfs-quota"]
description = "XFS project quota integration coverage on a loopback filesystem"
run = """
set -euo pipefail
tmp_dir="$(mktemp -d)"
trap 'rm -rf "$tmp_dir"' EXIT

go_arch="$(go env GOARCH)"
GOOS=linux GOARCH="$go_arch" CGO_ENABLED=0 go test -c -o "$tmp_dir/xfs-quota.test" ./internal/quota
chmod 0755 "$tmp_dir"
chmod 0555 "$tmp_dir/xfs-quota.test"
docker run --rm --privileged --platform "linux/$go_arch" \
  --env CACHE_CSI_REQUIRE_XFS_QUOTA=1 \
  --env CACHE_CSI_XFS_ROOT=/mnt/cache-csi-xfs \
  -v "$tmp_dir:/tmp/cache-csi-xfs-quota:ro" \
  --entrypoint /bin/bash \
  ubuntu:26.04 \
  -lc 'set -euo pipefail
    apt-get update -qq
    DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfsprogs
    image=/tmp/cache-csi-xfs.img
    truncate -s 1G "$image"
    mkfs.xfs -f -m reflink=0 "$image"
    mkdir -p /mnt/cache-csi-xfs
    mount -o loop,prjquota "$image" /mnt/cache-csi-xfs
    trap "umount /mnt/cache-csi-xfs" EXIT
    /tmp/cache-csi-xfs-quota/xfs-quota.test -test.v -test.count=1 -test.run "^TestXFSProjectQuotaEnforcesHardLimit$"'
"""

[tasks."test:e2e:kind"]
description = "Run cache lifecycle integration checks on a two-worker Kind cluster"
run = "bash hack/test-kind-lifecycle.sh"

[tasks.manifests]
description = "Generate CacheClass API code and CRD manifests"
run = """
set -euo pipefail
controller-gen crd:crdVersions=v1 paths=./api/v1alpha1 output:crd:artifacts:config=config/crd/bases
controller-gen object paths=./api/v1alpha1
cp config/crd/bases/cache.storage.walnuts.dev_cacheclasses.yaml deploy/helm/cache-csi-driver/crds/cache.storage.walnuts.dev_cacheclasses.yaml
"""

[tasks."lint:go"]
description = "lint the Go code"
run = "golangci-lint run"

[tasks."lint:chart"]
description = "Lint and render the Helm chart"
run = """
set -euo pipefail
helm lint deploy/helm/cache-csi-driver --kube-version 1.37.1
helm template cache-csi-driver deploy/helm/cache-csi-driver --kube-version 1.37.1 > /dev/null
"""

[tasks."package:chart"]
description = "Package the Helm chart into dist"
depends = ["manifests"]
run = """
set -euo pipefail
mkdir -p dist
helm package deploy/helm/cache-csi-driver --destination dist
"""
