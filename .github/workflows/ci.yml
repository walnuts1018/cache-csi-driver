name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true

      - name: Build node plugin
        run: mise run build

      - name: Run Go tests
        run: mise run test

      - name: Run CSI conformance checks for node capabilities
        run: mise run test:csi-sanity

      - name: Run Linux mount API integration test
        run: mise run test:mount-api

      - name: Verify generated API manifests
        run: |
          mise run manifests
          git diff --exit-code -- api/v1alpha1/zz_generated.deepcopy.go config/crd/bases/cache.storage.walnuts.dev_cacheclasses.yaml deploy/helm/cache-csi-driver/crds/cache.storage.walnuts.dev_cacheclasses.yaml

      - name: Run Go vet
        run: go vet ./...

      - name: Lint Go code
        run: mise run lint:go

      - name: Validate Helm chart
        run: mise run lint:chart

      - name: Check generated chart CRD
        run: cmp config/crd/bases/cache.storage.walnuts.dev_cacheclasses.yaml deploy/helm/cache-csi-driver/crds/cache.storage.walnuts.dev_cacheclasses.yaml
