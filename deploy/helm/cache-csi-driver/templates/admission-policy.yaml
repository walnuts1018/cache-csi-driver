apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-access") }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
  validations:
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(volume,
          !has(volume.csi) || volume.csi.driver != "cache.csi.walnuts.dev"
        )
      message: Cache CSI volumes are restricted to namespaces labeled cache.csi.walnuts.dev/allow-use=true.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-access") }}
spec:
  policyName: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-access") }}
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: cache.csi.walnuts.dev/allow-use
          operator: NotIn
          values:
            - "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-attributes") }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
  validations:
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(volume,
          !has(volume.csi) || volume.csi.driver != "cache.csi.walnuts.dev" ||
          (has(volume.csi.volumeAttributes) &&
          volume.csi.volumeAttributes.all(attribute,
            attribute in ["cacheClass", "cacheKey", "maxBytes"]) &&
          "cacheClass" in volume.csi.volumeAttributes &&
          volume.csi.volumeAttributes["cacheClass"] != "" &&
          "cacheKey" in volume.csi.volumeAttributes &&
          volume.csi.volumeAttributes["cacheKey"] != ""))
      message: Cache CSI volumeAttributes must contain cacheClass and cacheKey and may contain maxBytes only.
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(volume,
          !has(volume.csi) || volume.csi.driver != "cache.csi.walnuts.dev" ||
          !has(volume.csi.volumeAttributes) ||
          !("maxBytes" in volume.csi.volumeAttributes) ||
          (isQuantity(volume.csi.volumeAttributes["maxBytes"]) &&
          quantity(volume.csi.volumeAttributes["maxBytes"]).sign() > 0))
      message: Cache CSI maxBytes must be a positive Kubernetes quantity.
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(volume,
          !has(volume.csi) || volume.csi.driver != "cache.csi.walnuts.dev" ||
          ((!has(object.spec.nodeName) || object.spec.nodeName == "" ||
            (request.operation == "UPDATE" && has(oldObject) &&
            has(oldObject.spec.nodeName) && object.spec.nodeName == oldObject.spec.nodeName)) &&
          has(object.spec.schedulerName) &&
          object.spec.schedulerName == "cache-csi-scheduler" &&
          (!has(object.spec.nodeSelector) ||
            !("cache.csi.walnuts.dev/ready" in object.spec.nodeSelector) ||
            object.spec.nodeSelector["cache.csi.walnuts.dev/ready"] == "true")))
      message: Cache CSI Pods must use cache-csi-scheduler, must not set spec.nodeName, and must not conflict with the cache readiness node selector.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-attributes") }}
spec:
  policyName: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-attributes") }}
  validationActions:
    - Deny
  matchResources: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-scheduling") }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
  matchConditions:
    - name: pod-uses-cache-csi
      expression: >-
        has(object.spec.volumes) && object.spec.volumes.exists(volume,
          has(volume.csi) && volume.csi.driver == "cache.csi.walnuts.dev")
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !has(object.spec.nodeSelector)
          ? [JSONPatch{
              op: "add",
              path: "/spec/nodeSelector",
              value: {"cache.csi.walnuts.dev/ready": "true"}
            }]
          : !("cache.csi.walnuts.dev/ready" in object.spec.nodeSelector)
          ? [JSONPatch{
              op: "add",
              path: "/spec/nodeSelector/" + jsonpatch.escapeKey("cache.csi.walnuts.dev/ready"),
              value: "true"
            }]
          : []
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{
              op: "add",
              path: "/spec/schedulerName",
              value: "cache-csi-scheduler"
            }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-scheduling") }}
spec:
  policyName: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-scheduling") }}
  matchResources:
    namespaceSelector:
      matchLabels:
        cache.csi.walnuts.dev/allow-use: "true"
{{- if .Values.admissionPolicy.cacheClassAllowlist.enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-class-access") }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
  validations:
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(volume,
          !has(volume.csi) || volume.csi.driver != "cache.csi.walnuts.dev" ||
          (has(volume.csi.volumeAttributes) &&
          "cacheClass" in volume.csi.volumeAttributes &&
          has(namespaceObject.metadata.annotations) &&
          {{ .Values.admissionPolicy.cacheClassAllowlist.annotationKey | quote }} in namespaceObject.metadata.annotations &&
          namespaceObject.metadata.annotations[{{ .Values.admissionPolicy.cacheClassAllowlist.annotationKey | quote }}].split(",").exists(allowedClass,
            allowedClass.trim() == volume.csi.volumeAttributes["cacheClass"]))
        )
      message: Cache CSI volume cacheClass values must be listed in the namespace cache class allowlist annotation.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-class-access") }}
spec:
  policyName: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cache-class-access") }}
  validationActions:
    - Deny
  matchResources: {}
{{- end }}
