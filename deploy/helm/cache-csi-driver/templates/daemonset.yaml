apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cache-csi-driver.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cache-csi-driver.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cache-csi-driver.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "cache-csi-driver.selectorLabels" . | nindent 8 }}
      {{- $podAnnotations := dict "prometheus.io/scrape" "true" "prometheus.io/path" "/metrics" "prometheus.io/port" (toString .Values.metrics.port) }}
      {{- $podAnnotations = mergeOverwrite $podAnnotations (.Values.podAnnotations | default dict) }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cache-csi-driver.serviceAccountName" . }}
      automountServiceAccountToken: false
      priorityClassName: {{ .Values.priorityClassName | quote }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cache-csi-node
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" (.Chart.AppVersion | trimPrefix "v")) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --endpoint=unix:///csi/csi.sock
            - --metrics-address=:{{ .Values.metrics.port }}
            - --cache-root={{ .Values.cacheRootDir }}
            - --node-id=$(NODE_NAME)
            - --kubelet-root={{ .Values.kubeletRootDir }}
            - --gc-interval={{ .Values.gcInterval }}
            - --pressure-high-free-percent={{ .Values.pressure.highFreePercent }}
            - --pressure-low-free-percent={{ .Values.pressure.lowFreePercent }}
            - --pressure-high-inode-free-percent={{ .Values.pressure.highInodeFreePercent }}
            - --pressure-low-inode-free-percent={{ .Values.pressure.lowInodeFreePercent }}
            - --project-id-start={{ .Values.projectIDRange.start | int64 }}
            - --project-id-count={{ .Values.projectIDRange.count | int64 }}
            {{- with .Values.driver.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.driver.resources | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9808
            initialDelaySeconds: {{ .Values.driver.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.driver.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.driver.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.driver.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /csi
            - name: kubelet-pods
              mountPath: {{ .Values.kubeletRootDir }}/pods
              mountPropagation: Bidirectional
            - name: cache-root
              mountPath: {{ .Values.cacheRootDir }}
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: csi-node-driver-registrar
          image: "{{ .Values.registrar.image.repository }}:{{ .Values.registrar.image.tag }}"
          imagePullPolicy: {{ .Values.registrar.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.kubeletRootDir }}/plugins/cache.csi.walnuts.dev/csi.sock
            - --health-port=9809
            - --v=2
          resources:
            {{- toYaml .Values.registrar.resources | nindent 12 }}
          ports:
            - name: registrar
              containerPort: 9809
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: registrar
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: "{{ .Values.livenessProbe.image.repository }}:{{ .Values.livenessProbe.image.tag }}"
          imagePullPolicy: {{ .Values.livenessProbe.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9808
          resources:
            {{- toYaml .Values.livenessProbe.resources | nindent 12 }}
          ports:
            - name: healthz
              containerPort: 9808
              protocol: TCP
          volumeMounts:
            - name: csi-socket-dir
              mountPath: /csi
      volumes:
        - name: csi-socket-dir
          hostPath:
            path: {{ .Values.kubeletRootDir }}/plugins/cache.csi.walnuts.dev
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.kubeletRootDir }}/plugins_registry
            type: DirectoryOrCreate
        - name: kubelet-pods
          hostPath:
            path: {{ .Values.kubeletRootDir }}/pods
            type: Directory
        - name: cache-root
          hostPath:
            path: {{ .Values.cacheRootDir }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
