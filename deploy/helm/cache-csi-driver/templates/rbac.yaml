apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cacheclass-reader") }}
  labels:
    {{- include "cache-csi-driver.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - cache.storage.walnuts.dev
    resources:
      - cacheclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
      - serviceaccounts
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cacheclass-reader") }}
  labels:
    {{- include "cache-csi-driver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "cacheclass-reader") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cache-csi-driver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
