apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "scheduler") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cache-csi-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    clientConnection:
      kubeconfig: /etc/cache-csi-scheduler/kubeconfig
    leaderElection:
      leaderElect: true
      resourceNamespace: {{ .Release.Namespace }}
      resourceName: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "scheduler-election") }}
    profiles:
      - schedulerName: cache-csi-scheduler
    extenders:
      - urlPrefix: http://{{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "health-controller") }}.{{ .Release.Namespace }}.svc:8090
        filterVerb: filter
        httpTimeout: 10s
        nodeCacheCapable: false
        ignorable: false
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    contexts:
      - name: scheduler
        context:
          cluster: in-cluster
          user: scheduler
    current-context: scheduler
    users:
      - name: scheduler
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "scheduler") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cache-csi-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "cache-csi-driver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "cache-csi-driver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "scheduler") }}
      automountServiceAccountToken: true
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kube-scheduler
          image: "{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag }}"
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy }}
          args:
            - --config=/etc/cache-csi-scheduler/scheduler-config.yaml
            - --secure-port=0
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          volumeMounts:
            - name: scheduler-config
              mountPath: /etc/cache-csi-scheduler
              readOnly: true
      volumes:
        - name: scheduler-config
          configMap:
            name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "scheduler") }}
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cache-csi-driver.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: scheduler
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cache-csi-driver.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: scheduler
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cache-csi-driver.resourceName" (dict "root" . "suffix" "scheduler") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cache-csi-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "cache-csi-driver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
