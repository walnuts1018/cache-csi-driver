image:
  repository: ghcr.io/walnuts1018/cache-csi-driver
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

cacheRootDir: /var/lib/cache-csi
storage:
  backend: directory
  requireRootMountpoint: true
metrics:
  port: 9807
kubeletRootDir: /var/lib/kubelet
gcInterval: 30s
pressure:
  highFreePercent: 25
  lowFreePercent: 20
  highInodeFreePercent: 15
  lowInodeFreePercent: 10
projectIDRange:
  start: 2000000000
  count: 1000000

admissionPolicy:
  cacheClassAllowlist:
    enabled: false
    annotationKey: cache.storage.walnuts.dev/allowed-cache-classes

serviceAccount:
  create: true
  annotations: {}
  name: ""

healthController:
  replicaCount: 2
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - operator: Exists

podAnnotations: {}
priorityClassName: system-node-critical
podSecurityContext: {}

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - operator: Exists

affinity: {}

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

driver:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  extraArgs: []

registrar:
  image:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.18.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

livenessProbe:
  image:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.20.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
